name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Tests / lint / entry points / build / strict verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        # No `lerobot` extra: the suite runs against tests/fake_lerobot.py and
        # must never need LeRobot or torch.
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' ruff build twine flyto-indexer
          # The contract schema with evidence `observer` (flyto-core 06641cf38,
          # PR #141, released as 2.41.0), pinned by full SHA until it is on PyPI.
          pip install 'flyto-core @ git+https://github.com/flytohub/flyto-core@06641cf385a4758ef25a2c7465782a34d4d505d8'

      # The same steps as scripts/verify.sh, spelled out so each one shows here.
      - name: Ruff
        run: python -m ruff check src tests

      - name: Tests
        # tests/integration skips with its reason here: no Cloud backend in this job.
        run: python -m pytest -q -rs

      - name: Entry points load by name
        run: |
          python - <<'PY'
          from importlib.metadata import entry_points
          for group, name in (
              ('flyto.modules', 'lerobot'),
              ('flyto2.external_adapters', 'lerobot.arm'),
              ('flyto2.resource_discoverers', 'lerobot.arm'),
              ('console_scripts', 'flyto-lerobot-arm'),
          ):
              found = tuple(entry_points().select(group=group, name=name))
              assert len(found) == 1, (group, name)
              assert callable(found[0].load()), (group, name)
          PY

      - name: Build
        run: |
          python -m build
          python -m twine check dist/*

      - name: Strict repository verification
        run: |
          flyto-index scan .
          flyto-index verify . --strict
